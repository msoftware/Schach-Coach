server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # REST-API an das Backend weiterleiten (gleicher Ursprung, kein CORS nötig).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        # Bewusst überschreiben statt anhängen: Ein vom Client mitgeschickter X-Forwarded-For-Header darf die
        # Client-Adresse für das Rate-Limit und die Partiebegrenzung im Backend nicht verfälschen.
        proxy_set_header X-Forwarded-For $remote_addr;
        # Diese Header setzt nginx unten selbst; doppelte Header aus dem Backend vermeiden.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'" always;
}
